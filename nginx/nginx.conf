# Optional top-level reverse proxy for a bare-metal (non-Docker) deployment,
# fronting both the frontend static build and the backend API on one origin.
upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://backend_upstream/health;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
